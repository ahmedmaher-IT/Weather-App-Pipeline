version: '3.8'

services:
  # 1. خدمة Jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: always
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  # 2. تطبيق الـ Backend
  backend:
    build: ./BACK
    container_name: weather-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OPENWEATHER_API_KEY=cd1866915e01aad27530448a08c3947b
      - WEATHER_API_KEY=cd1866915e01aad27530448a08c3947b
      - API_KEY=cd1866915e01aad27530448a08c3947b
      - JWT_SECRET=mysecretkey123

  # 3. خدمة Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: weather-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus_config/prometheus.yml:/etc/prometheus_config/prometheus.yml:ro

  # 4. خدمة Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: weather-grafana
    restart: always
    ports:
      - "3000:3000"

volumes:
  jenkins_home: